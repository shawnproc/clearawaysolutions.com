<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f4a58"/>
      <stop offset="100%" stop-color="#1a6b7c"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="13" fill="url(#bg)"/>
  <!-- Swoosh — curves around the open right side of the C -->
  <path d="M 40 47 C 62 44 62 20 40 17"
        stroke="#4aabb8" stroke-width="4.5" fill="none"
        stroke-linecap="round"/>
  <!-- C — arc opening to the right -->
  <path d="M 36 21 A 13 13 0 1 0 36 43"
        stroke="white" stroke-width="7.5" fill="none"
        stroke-linecap="round"/>
</svg>
